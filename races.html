<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambit — Races</title>
<style>
:root{font:15px system-ui,sans-serif;color:#1b2935;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#163b35;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header a{color:white}h1{font-size:22px;margin:0}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px}main{max-width:1140px;margin:24px auto;padding:0 18px}.panel{background:white;border:1px solid #dce5ea;border-radius:12px;padding:20px;margin-bottom:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,button{font:inherit}input{border:1px solid #bfcbd1;border-radius:8px;padding:10px;width:100%}button{background:white;border:1px solid #c5d1d6;border-radius:8px;padding:10px 14px;cursor:pointer}.primary{background:#136d58;color:white;border-color:#136d58}.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;max-height:260px;overflow:auto;margin:10px 0}.pick{padding:9px;border:1px solid #dce5ea;border-radius:8px;display:flex;align-items:center;gap:8px;font-weight:400;cursor:pointer}.pick input{width:auto}.muted{color:#60717c;font-size:13px}.status{padding:10px;background:#e5f2ed;border-radius:8px;font-size:13px;margin:12px 0}.warn{background:#fff3de}.list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.active{background:#d8f1e6;border-color:#136d58}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:570px}td,th{border-bottom:1px solid #e2e9ec;padding:10px 8px;text-align:left}th{font-size:12px;color:#60717c}td.num{text-align:right;font-variant-numeric:tabular-nums}@media(max-width:600px){.fields{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>Gambit — Races</h1><small>Race workspace</small></div><a href="./index.html">Horse profiles</a></header>
<main><section class="panel"><h2>Create race</h2><form id="form"><div class="fields"><div><label for="location">Location / track</label><input id="location" required maxlength="100" placeholder="MORP"></div><div><label for="distance">Distance (metres)</label><input id="distance" type="number" min="1" step="1" required placeholder="1200"></div></div><div class="row" style="justify-content:space-between;margin-top:15px"><h3>Choose horses</h3><div class="row"><button type="button" id="all">Select all</button><button type="button" id="none">Clear</button></div></div><div id="picker" class="picker">Loading profiles…</div><p id="selectedCount" class="muted">0 selected</p><button class="primary">Create race</button></form><p id="status" class="status" role="status">Loading…</p></section>
<section class="panel"><h2>Saved races</h2><div id="list" class="list"></div><div id="details"></div><hr><h3>GitHub sync (optional)</h3><p class="muted">Races save in this browser first. To publish them to data/races.json, enter your repository-scoped GitHub token. It is not stored.</p><div class="row"><input id="token" type="password" autocomplete="off" aria-label="GitHub token" placeholder="GitHub token" style="max-width:240px"><button id="publish">Save races to GitHub</button><button id="reload">Load GitHub races</button><button id="export">Export races JSON</button></div></section></main>
<script>
(()=>{'use strict';
const repo='CodeByNath/Gambit',key='gambit-races-v1',file='data/races.json',$=id=>document.getElementById(id);
let horses=[],races=[],active=null,remoteSha=null,dirty=false;
const uuid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const message=(v,w=false)=>{$('status').textContent=v;$('status').className='status'+(w?' warn':'')};
const fmt=v=>v>=60?Math.floor(v/60)+':'+(v%60).toFixed(2).padStart(5,'0'):Number(v).toFixed(2)+'s';
function valid(a){if(!Array.isArray(a))throw Error('Invalid race file');return a.filter(r=>r&&typeof r.id==='string'&&typeof r.location==='string'&&Number.isInteger(Number(r.distance))&&Number(r.distance)>0&&Array.isArray(r.horseIds)).map(r=>({id:r.id,location:r.location,distance:Number(r.distance),horseIds:[...new Set(r.horseIds.filter(x=>typeof x==='string'))]}))}
async function fetchFile(p){const r=await fetch('https://api.github.com/repos/'+repo+'/contents/'+p+'?ref=main&v='+Date.now(),{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw Error('GitHub HTTP '+r.status);const j=await r.json();const bytes=Uint8Array.from(atob(j.content.replace(/\s/g,'')),x=>x.charCodeAt(0));return {data:JSON.parse(new TextDecoder().decode(bytes)),sha:j.sha}}
const inputs=()=>[...$('picker').querySelectorAll('input[type=checkbox]')];
function count(){$('selectedCount').textContent=inputs().filter(x=>x.checked).length+' selected'}
function picker(){const root=$('picker');root.replaceChildren();for(const h of [...horses].sort((a,b)=>a.name.localeCompare(b.name))){const l=document.createElement('label');l.className='pick';const x=document.createElement('input');x.type='checkbox';x.value=h.id;x.onchange=count;l.append(x,document.createTextNode(h.name));root.append(l)}if(!horses.length)root.textContent='No horse profiles found';count()}
function cell(tr,v,num=false){const td=document.createElement('td');td.textContent=v;if(num)td.className='num';tr.append(td)}
function recordTable(records){const wrap=document.createElement('div');wrap.className='tablewrap';const t=document.createElement('table'),head=document.createElement('tr');
for(const label of ['Date','Track','Condition','Distance','Finish','Completion time','Source']){const th=document.createElement('th');th.textContent=label;head.append(th)}t.append(head);
for(const r of records){const tr=document.createElement('tr'),values=[r.date||'—',r.track||'—',r.condition||'—',r.distance+'m',r.position==null?'—':r.position+(r.fieldSize?'/'+r.fieldSize:''),Number.isFinite(Number(r.seconds))?fmt(r.seconds):'—',r.timeType==='estimated'?'Estimated':'Recorded'];values.forEach((value,i)=>cell(tr,value,i===5));t.append(tr)}wrap.append(t);return wrap}
function sortedHistory(horse){return [...horse.races].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function render(){const list=$('list'),details=$('details');list.replaceChildren();details.replaceChildren();if(!races.length){list.textContent='No races created yet';return}if(!races.find(r=>r.id===active))active=races[0].id;
for(const race of races){const b=document.createElement('button');b.textContent=race.location+' · '+race.distance+'m · '+race.horseIds.length+' runners';b.className=race.id===active?'active':'';b.onclick=()=>{active=race.id;render()};list.append(b)}
const race=races.find(r=>r.id===active),heading=document.createElement('div');heading.className='row',h=document.createElement('h3');h.textContent=race.location+' · '+race.distance+'m';
const del=document.createElement('button');del.textContent='Delete race';del.onclick=()=>{if(confirm('Delete this saved race?')){races=races.filter(x=>x.id!==race.id);active=races[0]?.id||null;save()}};heading.append(h,del);details.append(heading);
const intro=document.createElement('p');intro.className='muted';intro.textContent='Each horse shows its latest recorded race (any distance), then EVERY race at '+race.distance+'m. Expand All history to inspect every stored record. Trials stay labelled separately.';details.append(intro);
const overviewWrap=document.createElement('div');overviewWrap.className='tablewrap';const overview=document.createElement('table'),top=document.createElement('tr');
for(const label of ['Horse','Weight','Latest race (any distance)','Latest time',''+race.distance+'m races',''+race.distance+'m best',''+race.distance+'m average']){const th=document.createElement('th');th.textContent=label;top.append(th)}overview.append(top);
for(const id of race.horseIds){const horse=horses.find(x=>x.id===id),tr=document.createElement('tr');if(!horse){cell(tr,'Unavailable profile: '+id);for(let i=0;i<6;i++)cell(tr,'—');overview.append(tr);continue}
const history=sortedHistory(horse),latest=history[0],exact=history.filter(r=>r.distance===race.distance&&!String(r.track||'').includes('(Trial)'));
cell(tr,horse.name);cell(tr,horse.weight+'kg');cell(tr,latest?(latest.date||'—')+' · '+latest.distance+'m · '+(latest.track||'—'):'—');cell(tr,latest?fmt(latest.seconds):'—',true);cell(tr,String(exact.length),true);cell(tr,exact.length?fmt(Math.min(...exact.map(r=>r.seconds))):'—',true);cell(tr,exact.length?fmt(exact.reduce((sum,r)=>sum+r.seconds,0)/exact.length):'—',true);overview.append(tr);
const section=document.createElement('section');section.className='panel';const title=document.createElement('h3');title.textContent=horse.name+' · '+horse.weight+'kg';section.append(title);
const latestLabel=document.createElement('p');latestLabel.className='muted';latestLabel.textContent='Latest race (any distance)';section.append(latestLabel);if(latest)section.append(recordTable([latest]));
const distanceLabel=document.createElement('h3');distanceLabel.textContent='All '+race.distance+'m official races ('+exact.length+')';section.append(distanceLabel);
if(exact.length)section.append(recordTable(exact));else{const missing=document.createElement('p');missing.className='muted';missing.textContent='No recorded official race at this exact distance.';section.append(missing)}
const extra=document.createElement('details'),summary=document.createElement('summary');summary.textContent='All history — '+history.length+' records (including other distances and trials)';extra.append(summary,recordTable(history));section.append(extra);details.append(section)
}
overviewWrap.append(overview);details.insertBefore(overviewWrap,intro.nextSibling);
const note=document.createElement('p');note.className='muted';note.textContent='Completion times are read directly from stored horse profiles. No new calculations, projections or ranking rules have been added.';details.append(note)
}
function save(){localStorage.setItem(key,JSON.stringify(races));dirty=true;render();message('Saved locally; use Save races to GitHub to publish.')}
$('all').onclick=()=>{inputs().forEach(x=>x.checked=true);count()};
$('none').onclick=()=>{inputs().forEach(x=>x.checked=false);count()};
$('form').onsubmit=e=>{e.preventDefault();const location=$('location').value.trim(),distance=Number($('distance').value),horseIds=inputs().filter(x=>x.checked).map(x=>x.value);if(!location||!Number.isInteger(distance)||distance<1||!horseIds.length){message('Enter a location, distance, and select horses.',true);return}const race={id:uuid(),location,distance,horseIds};races.push(race);active=race.id;$('form').reset();count();try{save()}catch(err){message(err.message,true)}};
$('reload').onclick=async()=>{if(dirty&&!confirm('Replace local races with GitHub data? Export a backup first if needed.'))return;try{const x=await fetchFile(file);races=valid(x.data);remoteSha=x.sha;dirty=false;active=races[0]?.id||null;localStorage.setItem(key,JSON.stringify(races));render();message('Loaded '+races.length+' races from GitHub.')}catch(e){message(e.message,true)}};
$('publish').onclick=async()=>{const token=$('token').value.trim();if(!token){message('Enter your GitHub token.',true);return}try{const x=await fetchFile(file);if(remoteSha&&x.sha!==remoteSha){message('Remote races have changed. Nothing overwritten.',true);return}if(!remoteSha&&x.data.length){message('GitHub already has races; load and reconcile first.',true);return}const content=btoa(Array.from(new TextEncoder().encode(JSON.stringify(races,null,2)+'\n'),v=>String.fromCharCode(v)).join(''));const r=await fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({message:'Save Gambit races',sha:x.sha,content,branch:'main'})});if(!r.ok)throw Error('GitHub HTTP '+r.status);const out=await r.json();remoteSha=out.content.sha;dirty=false;message('Races published to GitHub.')}catch(e){message(e.message,true)}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(races,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gambit-races.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
(async()=>{try{const local=localStorage.getItem(key);if(local){races=valid(JSON.parse(local));dirty=races.length>0;active=races[0]?.id||null}const x=await fetchFile('data/horses.json');if(!Array.isArray(x.data))throw Error('Invalid horse profiles');horses=x.data.filter(h=>h&&typeof h.id==='string'&&typeof h.name==='string'&&Array.isArray(h.races));picker();render();if(!dirty){const remote=await fetchFile(file);races=valid(remote.data);remoteSha=remote.sha;localStorage.setItem(key,JSON.stringify(races));render()}message('Loaded '+horses.length+' horses. '+(dirty?'Local races preserved.':'Ready to create a race.'))}catch(e){message('Unable to load data: '+e.message,true)}})();
})();
</script></body></html>
